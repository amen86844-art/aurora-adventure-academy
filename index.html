<!doctype html>
<html lang='en'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <meta name='theme-color' content='#fff4fa'>
  <title>A / An Adventure Academy</title>
  <style>
    :root{color-scheme:light;--ink:#413554;--muted:#746b81;--pink:#ff83b7;--pink-deep:#d84d8d;--lavender:#a58ae8;--blue:#83c9f2;--mint:#85d8bd;--yellow:#ffd56a;--line:#eadff0;--shadow:0 14px 35px rgba(93,60,119,.12);font-family:'Trebuchet MS','Arial Rounded MT Bold',Nunito,system-ui,sans-serif}
    *{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh;color:var(--ink);background:radial-gradient(circle at 7% 10%,rgba(255,255,255,.9) 0 2px,transparent 3px),radial-gradient(circle at 88% 20%,rgba(255,255,255,.85) 0 3px,transparent 4px),linear-gradient(145deg,#fff5fa 0%,#f4f0ff 48%,#eefaff 100%);background-size:120px 120px,160px 160px,auto}
    button{font:inherit}button:focus-visible{outline:4px solid #6c51c9;outline-offset:3px}.page{width:min(1120px,100%);margin:0 auto;padding:18px 20px 36px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand-mark{display:grid;place-items:center;width:46px;height:46px;flex:0 0 46px;border-radius:16px;background:linear-gradient(145deg,#ffacd0,#c7b5ff);box-shadow:0 7px 15px rgba(183,111,175,.2);font-size:25px}.brand-title{font-weight:900;font-size:17px;letter-spacing:-.3px}.brand-sub{color:var(--muted);font-size:12px;margin-top:2px}.hud{display:flex;justify-content:flex-end;align-items:center;gap:10px;flex:1}
    .score-chip,.sound-button{min-height:42px;border-radius:15px;border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.78);box-shadow:0 5px 15px rgba(85,60,109,.08)}.score-chip{display:flex;align-items:center;gap:6px;padding:0 13px;font-size:14px;font-weight:800;white-space:nowrap}.score-chip .star{color:#edae21;font-size:19px}.sound-button{padding:0 12px;color:var(--ink);cursor:pointer;font-weight:800}.progress-wrap{min-width:105px;width:min(180px,20vw)}.progress-label{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:11px;font-weight:800;margin-bottom:5px}.progress-track{height:9px;border-radius:20px;background:#e7deef;overflow:hidden}.progress-fill{height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#ff8ab9,#a98df0,#78c9ec);transition:width .45s ease}
    main{min-height:520px}.panel{position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.94);border-radius:30px;padding:clamp(22px,4vw,42px);background:rgba(255,255,255,.84);box-shadow:var(--shadow)}.panel:before,.panel:after{content:'✦';position:absolute;color:#e7a6ce;opacity:.58;font-size:21px;pointer-events:none}.panel:before{top:18px;right:25px}.panel:after{bottom:18px;left:22px;font-size:15px;color:#9f91e8}
    h1,h2,h3,p{margin-top:0}h1{font-size:clamp(32px,5vw,54px);line-height:1.04;letter-spacing:-1.5px;margin-bottom:12px}h2{font-size:clamp(25px,3vw,35px);line-height:1.12;letter-spacing:-.8px;margin-bottom:9px}h3{font-size:20px;margin-bottom:7px}.eyebrow{display:inline-flex;align-items:center;gap:7px;margin-bottom:13px;padding:7px 12px;border-radius:999px;color:#784a8f;background:#f5eaff;font-size:12px;font-weight:900;letter-spacing:.4px;text-transform:uppercase}.lead{max-width:650px;color:var(--muted);font-size:17px;line-height:1.55}.small{font-size:14px;line-height:1.5;color:var(--muted)}
    .hero-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(250px,.85fr);align-items:center;gap:22px}.hero-art{position:relative;min-height:285px;display:grid;place-items:center;border-radius:28px;background:linear-gradient(160deg,#fff4d9,#fce7f5 55%,#e9e4ff);overflow:hidden}.rainbow{position:absolute;width:245px;height:175px;top:23px;left:50%;transform:translateX(-50%);border:15px solid #ff9bbc;border-bottom:0;border-radius:150px 150px 0 0;box-shadow:inset 0 13px 0 #ffd46c,inset 0 26px 0 #90ddc3,inset 0 39px 0 #8ecbf0;opacity:.82}.girl{position:relative;z-index:1;margin-top:45px;width:150px;height:168px;display:grid;place-items:center;border-radius:80px 80px 48px 48px;background:linear-gradient(150deg,#fff,#ffeaf3);border:7px solid white;box-shadow:0 12px 24px rgba(109,70,120,.14);font-size:99px}.girl:before{content:'🧢';position:absolute;font-size:42px;top:-31px;left:44px;transform:rotate(-10deg)}.girl:after{content:'🧭';position:absolute;right:-29px;bottom:8px;font-size:34px}.girl-photo{position:relative;z-index:1;margin-top:36px;width:175px;height:210px;object-fit:cover;object-position:center 35%;border-radius:85px 85px 45px 45px;border:6px solid white;box-shadow:0 12px 24px rgba(109,70,120,.14)}.girl-photo.result-photo{width:112px;height:112px;margin:0;border-radius:50%;vertical-align:middle}.explorer-name{position:absolute;z-index:2;bottom:12px;left:50%;transform:translateX(-50%);padding:6px 14px;border-radius:999px;background:#fff;color:#784a8f;box-shadow:0 4px 12px rgba(93,60,119,.12);font-size:13px;font-weight:900}.float-star{position:absolute;font-size:26px;animation:bob 2.5s ease-in-out infinite}.float-star.one{left:12%;top:30%}.float-star.two{right:14%;top:18%;animation-delay:.5s}.float-star.three{right:16%;bottom:19%;animation-delay:1s}@keyframes bob{50%{transform:translateY(-8px) rotate(8deg)}}
    .action-row{display:flex;flex-wrap:wrap;align-items:center;gap:11px;margin-top:22px}.btn{min-height:50px;border:0;border-radius:16px;padding:12px 20px;cursor:pointer;font-weight:900;color:var(--ink);background:#f1ebf8;transition:transform .15s ease,box-shadow .15s ease,filter .15s ease}.btn:hover{transform:translateY(-2px);box-shadow:0 8px 16px rgba(87,62,111,.12);filter:brightness(1.02)}.btn:active{transform:translateY(0)}.btn.primary{color:white;background:linear-gradient(100deg,#ef6ea8,#9b7be1);box-shadow:0 9px 18px rgba(188,91,154,.23)}.btn.secondary{background:#e8f6ff;color:#345a7a}.btn.soft-pink{background:#fff0f6;color:#a34372}.btn:disabled{opacity:.52;cursor:not-allowed;transform:none;box-shadow:none}.rule-preview{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.rule-pill{padding:10px 14px;border-radius:15px;background:white;border:1px solid #f0e7f3;font-weight:800;box-shadow:0 4px 12px rgba(93,60,119,.06)}.rule-pill b{color:var(--pink-deep);font-size:18px}
    .section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;margin-bottom:21px}.section-head p{color:var(--muted);margin-bottom:0;line-height:1.5}.rule-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:22px 0}.rule-card{border-radius:22px;padding:21px;background:linear-gradient(145deg,#fff7fc,#fff);border:1px solid #f2dbe9}.rule-card.an{background:linear-gradient(145deg,#f5f2ff,#fff);border-color:#e3dbf7}.rule-title{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:900;margin-bottom:6px}.rule-title .article{display:grid;place-items:center;width:45px;height:45px;border-radius:15px;background:#ffe5f1;color:#b44b7c}.rule-card.an .article{background:#e9e0ff;color:#6952ae}.example-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}.example-chips span{padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.82);border:1px solid rgba(221,207,231,.7);font-weight:800;font-size:14px}.sound-rule{padding:16px 18px;border-radius:18px;color:#624a74;background:#fff4ce;text-align:center;font-size:18px;font-weight:900}.sound-rule small{display:block;margin-top:5px;font-weight:600;font-size:13px;color:#6e6070}
    .map-path{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;align-items:stretch}.mission-card{position:relative;min-height:198px;display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:17px 15px;border:2px solid transparent;border-radius:22px;background:#fff;box-shadow:0 7px 19px rgba(91,64,112,.09);color:var(--ink);cursor:pointer;transition:transform .17s ease,box-shadow .17s ease}.mission-card:hover{transform:translateY(-4px);box-shadow:0 12px 22px rgba(91,64,112,.14)}.mission-card:nth-child(1){background:linear-gradient(155deg,#fff1f6,#fff)}.mission-card:nth-child(2){background:linear-gradient(155deg,#effbff,#fff)}.mission-card:nth-child(3){background:linear-gradient(155deg,#f3efff,#fff)}.mission-card:nth-child(4){background:linear-gradient(155deg,#fff8e8,#fff)}.mission-card:nth-child(5){background:linear-gradient(155deg,#edfbf5,#fff)}.mission-card.done{border-color:#9ed9bf}.mission-number{font-size:11px;font-weight:900;color:#806b91;letter-spacing:.6px;text-transform:uppercase}.mission-icon{font-size:36px;line-height:1;margin:12px 0}.mission-name{font-size:16px;line-height:1.2;font-weight:900}.mission-desc{margin-top:6px;font-size:12px;color:var(--muted);line-height:1.35}.mission-status{margin-top:auto;padding-top:12px;font-size:12px;font-weight:900;color:#806293}.map-note{margin-top:17px;text-align:center;color:var(--muted);font-size:14px}
    .quiz-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:19px}.quiz-mission{color:#806293;font-weight:900;font-size:13px;text-transform:uppercase;letter-spacing:.5px}.question-count{border-radius:99px;padding:8px 12px;background:#f5effa;font-size:13px;font-weight:900;white-space:nowrap}.question-layout{display:grid;grid-template-columns:minmax(160px,.62fr) minmax(0,1.38fr);gap:23px;align-items:center}.question-art{min-height:220px;display:grid;place-items:center;border-radius:24px;background:linear-gradient(145deg,#fff2d3,#fbe8f6 55%,#e8f4ff)}.question-emoji{font-size:clamp(76px,10vw,116px);filter:drop-shadow(0 9px 5px rgba(74,45,91,.12))}.question-text{margin:12px 0 20px;font-size:clamp(28px,4vw,43px);font-weight:900;letter-spacing:-.8px;line-height:1.18}.choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.choice{min-height:59px;padding:12px 14px;border:2px solid #e9e0f0;border-radius:17px;background:#fff;color:var(--ink);font-size:17px;font-weight:900;text-align:left;cursor:pointer;transition:.15s ease}.choice:hover{border-color:#b7a2e2;transform:translateY(-1px)}.choice.selected{border-color:#946fd7;background:#f4efff;box-shadow:0 0 0 3px rgba(148,111,215,.13)}.choice:disabled{cursor:default}.feedback{margin-top:16px;border-radius:18px;padding:15px 17px;line-height:1.5;background:#eaf9f1;border:1px solid #bde8d1;color:#315f4b}.feedback.wrong{background:#fff5e8;border-color:#f5d6a1;color:#76572d}.feedback strong{display:block;font-size:17px;margin-bottom:3px}.inline-error{min-height:22px;margin:6px 0 0;color:#a03e65;font-weight:800;font-size:14px}.hint-line{margin-top:15px;padding:11px 13px;border-radius:14px;background:#fff8df;color:#705d33;font-size:14px}.completion-art{text-align:center;margin:4px 0 15px;font-size:68px;animation:bob 2.5s ease-in-out infinite}.center{text-align:center}.score-big{font-size:clamp(40px,7vw,74px);font-weight:1000;letter-spacing:-2px;color:#8c64d0;margin:8px 0}.star-collection{display:flex;justify-content:center;flex-wrap:wrap;gap:5px;margin:19px auto;max-width:520px}.star-cell{display:grid;place-items:center;width:38px;height:38px;border-radius:13px;background:#f0ebf5;color:#c9bfd4;font-size:22px}.star-cell.earned{background:#fff0bf;color:#e7a51e;box-shadow:inset 0 0 0 1px #f9df8f}.summary-row{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:14px 0 20px}.summary-chip{padding:10px 13px;border-radius:14px;background:#f8f3fb;font-weight:900}.review-list{display:grid;gap:12px;margin:20px 0}.review-item{padding:16px;border-radius:17px;background:#fff8ef;border:1px solid #f3dfc3}.review-item h3{font-size:16px;margin:0 0 8px}.review-item p{margin:5px 0;line-height:1.45}.review-item .correct-answer{color:#28694b;font-weight:900}.review-item .your-answer{color:#8e5b2e;font-weight:800}.results-rules{margin:20px auto 0;max-width:650px;padding:17px 20px;text-align:left;border-radius:18px;background:#f7f2ff;line-height:1.6}.sparkle-row{letter-spacing:7px;font-size:22px;margin-bottom:8px}.footer-note{text-align:center;padding-top:16px;color:#8d8098;font-size:12px}
    @media(max-width:860px){.map-path{grid-template-columns:repeat(3,1fr)}.mission-card{min-height:175px}}
    @media(max-width:640px){.page{padding:12px 12px 24px}.topbar{align-items:flex-start;flex-wrap:wrap}.brand-title{font-size:15px}.hud{flex-basis:100%;justify-content:space-between}.progress-wrap{flex:1;width:auto;max-width:190px}.hero-grid,.question-layout{grid-template-columns:1fr}.hero-art{min-height:245px}.question-art{min-height:145px}.question-emoji{font-size:78px}.rule-grid{grid-template-columns:1fr}.map-path{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.mission-card{min-height:165px;padding:14px 12px}.panel{border-radius:23px;padding:23px 17px}.section-head{display:block}.section-head .btn{margin-top:13px}}
    @media(max-width:380px){.choice-grid{grid-template-columns:1fr}.map-path{grid-template-columns:1fr 1fr}.score-chip{padding:0 9px;font-size:12px}.sound-button{padding:0 9px;font-size:12px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
</head>

  <div class='page'>
    <header class='topbar'>
      <div class='brand'><div class='brand-mark' aria-hidden='true'>🌈</div><div><div class='brand-title'>A / An Adventure Academy</div><div class='brand-sub'>A little word adventure for big explorers</div></div></div>
      <div class='hud'>
        <div class='score-chip' aria-label='Current star score'><span class='star' aria-hidden='true'>★</span><span id='scoreValue'>0</span><span>/ 15</span></div>
        <div class='progress-wrap'><div class='progress-label'><span>Adventure</span><span id='progressText'>0 / 15</span></div><div class='progress-track' role='progressbar' aria-label='Questions answered' aria-valuemin='0' aria-valuemax='15' aria-valuenow='0' id='progressBar'><div class='progress-fill' id='progressFill'></div></div></div>
        <button class='sound-button' id='soundToggle' type='button' aria-pressed='false' aria-label='Turn sound on'>🔇 Sound off</button>
      </div>
    </header>
    <main id='app' aria-live='polite'></main>
    <div class='footer-note'>Made for curious little word explorers ✨</div>
  </div>

  }
  function guide(){
    return "<section class='panel'><div class='section-head'><div><div class='eyebrow'>📖 Your explorer guide</div><h2>Meet “a” and “an”</h2><p>Both words mean one. Listen to the sound that comes next!</p></div><div aria-hidden='true' style='font-size:48px'>🧚‍♀️✨</div></div><div class='rule-grid'><article class='rule-card'><div class='rule-title'><span class='article'>A</span> Use “a”</div><p class='small'>Use <strong>a</strong> before a consonant sound.</p><div class='example-chips'><span>A cat</span><span>A dog</span><span>A book</span><span>A uniform</span><span>A yellow apple</span></div></article><article class='rule-card an'><div class='rule-title'><span class='article'>An</span> Use “an”</div><p class='small'>Use <strong>an</strong> before a vowel sound.</p><div class='example-chips'><span>An apple</span><span>An egg</span><span>An orange</span><span>An umbrella</span><span>An hour</span></div></article></div><div class='sound-rule'>👂 Listen to the FIRST SOUND, not just the first letter!<small>Uniform begins with /y/ like “you.” The h in hour is quiet and silent.</small></div><div class='action-row'><button class='btn primary' data-action='map'>LET’S SEE THE MAP <span aria-hidden='true'>🗺️</span></button><button class='btn soft-pink' data-action='home'>Back to welcome</button></div></section>";
  }
  function mapView(){
    const cards=missions.map((m,i)=>{const done=isMissionComplete(i),n=state.answers[i].filter(Boolean).length,status=done?"⭐ "+missionScore(i)+" / 3 stars":n?n+" / 3 answered":"Tap to explore";return "<button class='mission-card "+(done?"done":"")+"' type='button' data-action='open-mission' data-index='"+i+"' aria-label='Mission "+(i+1)+": "+esc(m.title)+". "+esc(status)+"'><span class='mission-number'>Mission "+(i+1)+"</span><span class='mission-icon' aria-hidden='true'>"+m.icon+"</span><span class='mission-name'>"+esc(m.title)+"</span><span class='mission-desc'>"+esc(m.description)+"</span><span class='mission-status'>"+status+"</span></button>"}).join("");
    return "<section class='panel'><div class='section-head'><div><div class='eyebrow'>🗺️ Pick your path</div><h2>Adventure Map</h2><p>Choose any mission. Each one has three little challenges!</p></div><div aria-hidden='true' style='font-size:45px'>🦋</div></div><div class='map-path' aria-label='Five adventure missions'>"+cards+"</div><p class='map-note'>Collect a star for each correct answer. You can explore the missions in any order! 🌟</p>"+(allMissionsComplete()?"<div class='center action-row' style='justify-content:center'><button class='btn primary' data-action='results'>SEE MY TREASURE 🎁</button></div>":"")+"<div class='action-row'><button class='btn soft-pink' data-action='guide'>Review the sound rule</button><button class='btn secondary' data-action='home'>Welcome screen</button></div></section>";
  }
  function quiz(){
    const m=missions[state.missionIndex],q=m.questions[state.questionIndex],saved=state.answers[state.missionIndex][state.questionIndex],checked=Boolean(saved),selected=checked?saved.selected:state.selected;
    const choices=q.options.map((op,i)=>{const mark=checked&&i===q.answer?" ✓":checked&&i===selected&&!saved.correct?" ✦":"";return "<button class='choice"+(i===selected?" selected":"")+"' type='button' data-action='select' data-index='"+i+"' aria-pressed='"+(i===selected?"true":"false")+"' "+(checked?"disabled":"")+">"+esc(op)+mark+"</button>"}).join("");
    const feedback=checked?"<div class='feedback "+(saved.correct?"":"wrong")+"' role='status'><strong>"+(saved.correct?"🌟 Superstar! Great job!":"💛 Good try! Keep going!")+"</strong>"+esc(q.feedback)+(saved.correct?"":"<br><b>The answer is: "+esc(q.options[q.answer])+"</b>")+"</div>":"";
    const hint=state.hintVisible&&!checked?"<div class='hint-line' role='status'>💡 Hint: "+esc(q.hint)+"</div>":"";
    const controls=checked?"<button class='btn primary' data-action='next'>"+(state.questionIndex===2?"FINISH MISSION":"NEXT QUESTION")+" <span aria-hidden='true'>➜</span></button>":"<button class='btn primary' data-action='check'>CHECK ANSWER <span aria-hidden='true'>✓</span></button><button class='btn secondary' data-action='hint' aria-pressed='"+state.hintVisible+"'>Need a Hint? 💡</button>";
    return "<section class='panel'><div class='quiz-top'><button class='btn soft-pink' data-action='map' aria-label='Return to adventure map'>← Map</button><div class='quiz-mission'>"+m.icon+" Mission "+(state.missionIndex+1)+": "+esc(m.title)+"</div><div class='question-count'>Question "+(state.questionIndex+1)+" of 3</div></div><p class='small'>"+esc(m.instruction)+"</p><div class='question-layout'><div class='question-art' aria-hidden='true'><span class='question-emoji'>"+q.emoji+"</span></div><div><div class='question-text'>"+esc(q.prompt)+"</div><div class='choice-grid' role='group' aria-label='Choose an answer'>"+choices+"</div><div class='inline-error' role='alert'>"+esc(state.error)+"</div>"+feedback+hint+"<div class='action-row'>"+controls+"</div></div></div></section>";
  }
  function missionDone(){
    const m=missions[state.missionIndex],n=missionScore(state.missionIndex),words=n===3?"Three shining stars! You were amazing!":n===2?"Lovely work! You found lots of sound clues!":"You finished the mission! Every try helps you learn!";
    return "<section class='panel center'><div class='eyebrow'>Mission "+(state.missionIndex+1)+" complete</div><div class='completion-art' aria-hidden='true'>"+m.icon+" ✨🎉</div><h2>"+esc(m.title)+" finished!</h2><p class='lead' style='margin-left:auto;margin-right:auto'>"+words+"</p><div class='score-big'>"+n+" <span style='font-size:.48em;color:#edb83b'>★</span> <span style='font-size:.4em;color:var(--muted)'>/ 3 stars</span></div><div class='action-row' style='justify-content:center'><button class='btn primary' data-action='continue'>"+(allMissionsComplete()?"SEE FINAL TREASURE":"CONTINUE ADVENTURE")+" ➜</button><button class='btn soft-pink' data-action='retry'>RETRY THIS MISSION</button><button class='btn secondary' data-action='map'>Adventure map</button></div></section>";
  }
  function results(){
    const score=totalCorrect(),wrong=allAnswers().filter(x=>!x.correct).length;
    const message=score===15?"Amazing! You are an A / An Super Detective!":score>=11?"Fantastic work! You are learning so well!":score>=7?"Good effort! Keep practising and collecting stars!":"Keep going, Little Star! Every mistake helps you learn!";
    const stars=Array.from({length:15},(_,i)=>"<span class='star-cell "+(i<score?"earned":"")+"' aria-label='"+(i<score?"Star earned":"Star to collect")+"'>★</span>").join("");
    return "<section class='panel center'><div class='sparkle-row' aria-hidden='true'>✨ ⭐ 🎊 ⭐ ✨</div><div class='completion-art'><img class='girl-photo result-photo' data-aurora alt='Aurora celebrating'>🎁🌟</div><div class='eyebrow'>Your adventure treasure</div><h2>Super Detective Results!</h2><div class='score-big'>"+score+"<span style='font-size:.48em;color:var(--muted)'> / 15 stars</span></div><p class='lead' style='margin-left:auto;margin-right:auto'>"+message+"</p><div class='star-collection' aria-label='"+score+" stars earned out of 15'>"+stars+"</div><div class='summary-row'><div class='summary-chip'>✅ Correct: "+score+"</div><div class='summary-chip'>💛 Keep practising: "+wrong+"</div></div><div class='results-rules'><strong>🌈 Remember the sound rule</strong><br>Use <b>a</b> before a consonant sound: <b>a cat</b>, <b>a uniform</b>.<br>Use <b>an</b> before a vowel sound: <b>an apple</b>, <b>an hour</b>.<br><b>Listen to the first sound!</b></div><div class='action-row' style='justify-content:center'><button class='btn primary' data-action='review'>REVIEW MY MISTAKES 🔎</button><button class='btn soft-pink' data-action='play-again'>PLAY AGAIN 🔄</button></div></section>";
  }
  function review(){
    const mistakes=[];missions.forEach((m,mi)=>m.questions.forEach((q,qi)=>{const a=state.answers[mi][qi];if(a&&!a.correct)mistakes.push("<article class='review-item'><h3>Mission "+(mi+1)+", Question "+(qi+1)+": "+esc(q.prompt)+"</h3><p class='your-answer'>Your answer: "+esc(q.options[a.selected])+"</p><p class='correct-answer'>Correct answer: "+esc(q.options[q.answer])+"</p><p>"+esc(q.feedback)+"</p></article>")}));
    const body=mistakes.length?"<div class='review-list'>"+mistakes.join("")+"</div>":"<div class='feedback' role='status'><strong>🌟 A perfect adventure!</strong>You didn’t miss any answers. You can explore the sound rule or play again.</div>";
    return "<section class='panel'><div class='eyebrow'>🔎 Your learning clues</div><h2>Review My Mistakes</h2><p class='small'>These are the questions to practise again. Every sound clue makes you stronger!</p>"+body+"<div class='action-row'><button class='btn primary' data-action='results'>BACK TO RESULTS</button><button class='btn soft-pink' data-action='play-again'>PLAY AGAIN 🔄</button></div></section>";
  }
  function render(){updateHud();const views={welcome:welcome,guide:guide,map:mapView,quiz:quiz,missionDone:missionDone,results:results,review:review};app.innerHTML=views[state.screen]();app.querySelectorAll("img[data-aurora]").forEach(image=>image.src=AURORA_PHOTO)}
  app.addEventListener("click",event=>{
    const b=event.target.closest("button[data-action]");if(!b)return;const a=b.dataset.action;
    if(a==="start"){setScreen("guide");playSound("tap")}
    else if(a==="guide")setScreen("guide")
    else if(a==="map")backMap()
    else if(a==="home")setScreen("welcome")
    else if(a==="open-mission")startMission(Number(b.dataset.index),false)
    else if(a==="select"){if(state.screen!=="quiz"||state.answers[state.missionIndex][state.questionIndex])return;state.selected=Number(b.dataset.index);state.error="";playSound("tap");render()}
    else if(a==="hint"){state.hintVisible=!state.hintVisible;state.error="";render()}
    else if(a==="check"){if(state.selected===null){state.error="Choose an answer first, Little Explorer! 🌟";render();return}const q=missions[state.missionIndex].questions[state.questionIndex],correct=state.selected===q.answer;state.answers[state.missionIndex][state.questionIndex]={selected:state.selected,correct:correct};state.error="";playSound(correct?"correct":"wrong");render()}
    else if(a==="next"){if(state.questionIndex<2){state.questionIndex++;state.selected=null;state.hintVisible=false;state.error="";render()}else{setScreen("missionDone");playSound("mission")}}
    else if(a==="continue"){setScreen(allMissionsComplete()?"results":"map");playSound("tap")}
    else if(a==="retry")startMission(state.missionIndex,true)
    else if(a==="results")setScreen("results")
    else if(a==="review")setScreen("review")
    else if(a==="play-again")restart()
  });
  soundToggle.addEventListener("click",()=>{state.soundOn=!state.soundOn;soundToggle.setAttribute("aria-pressed",String(state.soundOn));soundToggle.setAttribute("aria-label",state.soundOn?"Turn sound off":"Turn sound on");soundToggle.textContent=state.soundOn?"🔊 Sound on":"🔇 Sound off";if(state.soundOn)playSound("tap")});
  render();
  </script>
</body>
</html>
